<!DOCTYPE html>
<!-- Estrutura da calculadora; o comportamento fica em script.js. -->
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <section class="container">
        <h1>Fomrulário de cadastro</h1>
        <ul>
            <li>Nenhum campo pode estar vazio</li>
            <li>Usuário só poderá conter letras /ou números </li>
            <li>Usuário deverá ter entre 3 a 12 caracteres </li>
            <li>Senha precisa ter entre 6 a 12 caracteres </li>
        </ul>

        <form action="/" method="post" class="formulario">
            <label>Nome:</label>
            <input type="text" class="nome validar">
            <label>Sobrenome:</label>
            <input type="text" class="sobrenome validar">
            <label>CPF:</label>
            <input type="text" class="cpf validar">
            <label>Usuário:</label>
            <input type="text" class="usuario validar">
            <label>Senha:</label>
            <input type="password" class="senha validar">
            <label>Repetir Senha:</label>
            <input type="password" class="repetir-senha validar">

            <button type="submit">Enviar</button>
        </form>
    </section>
    <script src="./assets/js/script.js"></script>
    <Script src="./assets/js/validaCPF.js"></Script>
</body>
</html>
